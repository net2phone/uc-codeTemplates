on:
  push:
    tags:
      - '*'
jobs:
  copy-folders:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Copy vue
      run: cp -R Vue ${{github.workspace}}/artifacts/vue-$(basename ${{github.ref}})
    - name: Copy react
      run: cp -R React ${{github.workspace}}/artifacts/react-$(basename ${{github.ref}})
    - name: Copy javascript
      run: cp -R Javascript ${{github.workspace}}/artifacts/javascript-$(basename ${{github.ref}})
    - name: Upload vue artifact
      uses: actions/upload-artifact@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        name: vue-${{github.ref}}
        path: ${{github.workspace}}/artifacts/vue-$(basename ${{github.ref}})
    - name: Upload react artifact
      uses: actions/upload-artifact@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        name: react-${{github.ref}}
        path: ${{github.workspace}}/artifacts/react-$(basename ${{github.ref}})
    - name: Upload javascript artifact
      uses: actions/upload-artifact@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        name: javascript-${{github.ref}}
        path: ${{github.workspace}}/artifacts/javascript-$(basename ${{github.ref}})
