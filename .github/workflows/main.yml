on:
  push:
    tags:
      - '*'
jobs:
  copy-folders:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set variables
      id: vars
      run: echo "::set-output name=basename::$(basename ${{github.ref}})"
    - name: Create artifacts directory
      run: mkdir -p ${{github.workspace}}/artifacts
    - name: Copy vue
      run: cp -R ${{github.workspace}}/Vue ${{github.workspace}}/artifacts/vue-${{ steps.vars.outputs.basename }}
    - name: Copy react
      run: cp -R ${{github.workspace}}/React ${{github.workspace}}/artifacts/react-${{ steps.vars.outputs.basename }}
    - name: Copy javascript
      run: cp -R ${{github.workspace}}/Javascript ${{github.workspace}}/artifacts/javascript-${{ steps.vars.outputs.basename }}
    - name: Upload vue artifact
      uses: actions/upload-artifact@v3
      with:
        name: vue-${{ steps.vars.outputs.basename }}
        path: ${{github.workspace}}/artifacts/vue-${{ steps.vars.outputs.basename }}
    - name: Upload react artifact
      uses: actions/upload-artifact@v3
      with:
        name: react-${{ steps.vars.outputs.basename }}
        path: ${{github.workspace}}/artifacts/react-${{ steps.vars.outputs.basename }}
    - name: Upload javascript artifact
      uses: actions/upload-artifact@v3
      with:
        name: javascript-${{ steps.vars.outputs.basename }}
        path: ${{github.workspace}}/artifacts/javascript-${{ steps.vars.outputs.basename }}
