on:
  push:
    tags:
      - '*'
jobs:
  copy-folders:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set variables
      id: vars
      run: echo "basename=$(basename ${{github.ref}})" >> $GITHUB_OUTPUT
    - name: Create artifacts directory
      run: mkdir -p ${{github.workspace}}/artifacts
    - name: Copy vue
      run: cp -R ${{github.workspace}}/Vue ${{github.workspace}}/artifacts/vue-${{ steps.vars.outputs.basename }}
    - name: Copy react
      run: cp -R ${{github.workspace}}/React ${{github.workspace}}/artifacts/react-${{ steps.vars.outputs.basename }}
    - name: Copy javascript
      run: cp -R ${{github.workspace}}/Javascript ${{github.workspace}}/artifacts/javascript-${{ steps.vars.outputs.basename }}
    - name: Upload vue artifact
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{github.workspace}}/artifacts/vue-${{ steps.vars.outputs.basename }}
        asset_name: vue-${{ steps.vars.outputs.basename }}
        tag: ${{ github.ref }}
        overwrite: true
    - name: Upload react artifact
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{github.workspace}}/artifacts/react-${{ steps.vars.outputs.basename }}
        asset_name: react-${{ steps.vars.outputs.basename }}
        tag: ${{ github.ref }}
        overwrite: true
    - name: Upload javascript artifact
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{github.workspace}}/artifacts/javascript-${{ steps.vars.outputs.basename }}
        asset_name: javascript-${{ steps.vars.outputs.basename }}
        tag: ${{ github.ref }}
        overwrite: true
